name: 配置 Eta 构建环境
description: 安装 JDK、Gradle 与 Android SDK，供 PR Check 和 Eta Build 共用

runs:
  using: composite
  steps:
    - name: 配置 JDK 25
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      with:
        distribution: temurin
        java-version: "25"

    # setup-gradle 默认执行 Gradle Wrapper 校验，无需单独的校验步骤
    - name: 配置 Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      with:
        cache-provider: basic

    - name: 配置 Android SDK 工具
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      with:
        packages: ""
        log-accepted-android-sdk-licenses: false

    - name: 安装 Android SDK 37
      shell: bash
      run: sdkmanager --channel=3 "platforms;android-37.0"

    # 离线语音识别依赖 sherpa-onnx 的预编译 AAR（含 arm64-v8a 原生库）。
    # 本地网络拉不动 GitHub 资产，改由 runner 下载；同时打印关键类签名，便于核对 Kotlin API。
    - name: 下载 sherpa-onnx AAR
      shell: bash
      run: |
        mkdir -p app/libs
        curl -sSL --retry 3 --max-time 300 \
          -o app/libs/sherpa-onnx-2.0.1.aar \
          https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
        ls -l app/libs
        unzip -o -q app/libs/sherpa-onnx-2.0.1.aar classes.jar -d /tmp/ksp_probe
        unzip -o -q /tmp/ksp_probe/classes.jar -d /tmp/ksp_probe/cls
        for c in OfflineRecognizer OfflineRecognizerConfig OfflineModelConfig OfflineSenseVoiceModelConfig FeatureConfig;
        do
          echo "=== $c ==="
          javap -classpath /tmp/ksp_probe/cls com.k2fsa.sherpa.onnx.$c 2>/dev/null | head -40 || true
        done

    # 语音克隆用 sherpa 的 OfflineTts（含 zipvoice zero-shot），打印签名以便按实测写封装。
    - name: 探测 OfflineTts 签名
      shell: bash
      run: |
        for c in OfflineTts OfflineTtsConfig OfflineTtsModelConfig OfflineTtsVitsModelConfig OfflineTtsZipvoiceModelConfig GeneratedAudio;
        do
          echo "=== $c ==="
          javap -classpath /tmp/ksp_probe/cls com.k2fsa.sherpa.onnx.$c 2>/dev/null | head -25 || true
        done
